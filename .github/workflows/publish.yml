# Publish to npm on version tags.
#
# Tag a release with `git tag v0.4.25 && git push origin v0.4.25` (tag format
# `v*`).
#
# The `test` job below calls .github/workflows/test.yml — the very same workflow
# that runs on pull requests — so typecheck and the unit suite (with the coverage
# thresholds in vitest.config.ts as a hard gate) must pass before anything is
# published. That call is not affected by test.yml's `paths-ignore` filter,
# which only applies to `pull_request`: a release tag always runs the tests.
#
# Only after that does the `publish` job:
#
#   1. check the tag matches `version` in package.json;
#   2. run `pnpm build` + `pnpm verify:dist`, so the artifact that actually ships
#      is importable and complete (`prepack` would otherwise rebuild it
#      unattended inside `pnpm publish`);
#   3. run `pnpm publish` with the NPM_TOKEN repository secret.
#
# Setup (one time): GitHub repo → Settings → Secrets and variables →
# Actions → New repository secret:
#   - `NPM_TOKEN`      = an npm access token with publish scope
#                        (https://www.npmjs.com/settings/<user>/tokens)
#   - `CODECOV_TOKEN`  = the Codecov upload token, forwarded to the test job

name: publish

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  test:
    # Reuse the commit checks instead of keeping a second, drifting copy here.
    uses: ./.github/workflows/test.yml
    permissions:
      contents: read
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  publish:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check the tag matches package.json
        env:
          TAG: ${{ github.ref_name }}
        run: |
          # The version lives in package.json; the tag must MATCH it. Fail
          # fast with a clear message instead of rewriting (a rewrite can
          # silently drop the field via JSON.stringify, which makes pnpm
          # fail with PACKAGE_VERSION_NOT_FOUND after prepack).
          node -e "const p=require('./package.json');const tag=process.env.TAG.replace(/^v/,'');if(p.version!==tag){console.error('package.json version '+p.version+' does not match tag '+process.env.TAG+' — bump package.json first, commit, then tag');process.exit(1)}console.log('releasing version:',p.version)"

      - name: Build
        run: pnpm build

      - name: Verify the published build
        run: pnpm verify:dist

      - name: Publish
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > .npmrc
          # --no-git-checks: CI checkout may not carry the tag locally, so
          # pnpm's own tag/version git check is unreliable here; the explicit
          # match check above is authoritative. prepack runs `pnpm build`
          # again, so what lands on the registry is exactly what the previous
          # step verified.
          pnpm publish --no-git-checks
